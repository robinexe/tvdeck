<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, initial-scale=1">
  <title>TVDeck</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800&display=swap">
  <link rel="icon" href="img/favicon-64.png">
  <script>
    // Installed from GitHub (gh/user/repo), TizenBrew loads files through
    // jsDelivr, which can serve the branch's files for hours after a push.
    // So code loads from the exact commit seen last time (immutable URLs),
    // and a newer commit is looked up in the background for the next launch.
    (function () {
      // gh/user/repo, optionally pinned (@ref): after one launch, the newest
      // commit is always used.
      var gh = /\/module\/gh%2F([^/%]+)%2F([^/%@]+)(?:%40[^/]*)?\//.exec(location.pathname);
      // One saved build per repository: a commit remembered by another
      // TVDeck module (the original, or another fork) must never be loaded here.
      var KEY = 'tvdeck:build' + (gh ? ':' + gh[1] + '/' + gh[2] : '');
      var base = '';
      try {
        var build = localStorage.getItem(KEY);
        if (gh && build) base = 'https://cdn.jsdelivr.net/gh/' + gh[1] + '/' + gh[2] + '@' + build + '/app/';
      } catch (e) { /* storage unavailable: use the proxied files */ }
      window.TVDECK_BASE = base;
      document.write('<link rel="stylesheet" href="' + base + 'style.css">');
      document.write('<link rel="stylesheet" href="' + base + 'premium.css">');
      if (!gh || !window.fetch) return;
      fetch('https://api.github.com/repos/' + gh[1] + '/' + gh[2] + '/commits/main',
        { headers: { Accept: 'application/vnd.github.sha' } })
        .then(function (res) { return res.ok ? res.text() : ''; })
        .then(function (sha) {
          sha = sha.trim();
          if (/^[0-9a-f]{40}$/.test(sha)) localStorage.setItem(KEY, sha.slice(0, 12));
        })
        .catch(function () { /* offline: keep the current build */ });
    })();
  </script>
</head>
<body class="booting">
  <!-- Color wash taken from the focused tile's icon; two layers cross-fade. -->
  <div class="backdrop" aria-hidden="true">
    <canvas class="wash" width="16" height="9"></canvas>
    <canvas class="wash" width="16" height="9"></canvas>
    <div class="backdrop-shade"></div>
  </div>

  <!-- Loading mark: shown only when the first load is slow. -->
  <div class="splash" aria-hidden="true"><img src="img/mark-256.png" alt=""></div>

  <!-- Fixed top bar: quick access on the left, time and status on the right. -->
  <header class="topbar">
    <div class="topbar-left">
    <nav class="nav" id="nav">
      <img class="nav-brand" src="img/mark-256.png" alt="TVDeck">
      <div class="nav-btn" data-nav="settings"><span class="nav-icon" data-icon="settings"></span><span>Ajustes</span></div>
      <div class="nav-btn" data-nav="phone"><span class="nav-icon" data-icon="phone"></span><span>Enviar do celular</span></div>
    </nav>
    <div id="hello" class="hello"></div>
    <div id="hello-sub" class="hello-sub"></div>
    </div>
    <div class="shelf-status">
      <div id="clock" class="clock">--:--</div>
      <div id="date" class="date"></div>
      <div class="weather" id="weather" hidden>
        <span id="weather-glyph" class="weather-glyph"></span>
        <span id="weather-temp" class="weather-temp"></span>
        <span id="weather-label" class="weather-label"></span>
        <span id="weather-range" class="weather-range"></span>
      </div>
      <div id="ticker" class="ticker"></div>
    </div>
  </header>

  <div class="viewport">
    <div id="page" class="page">
      <header class="shelf">
        <div class="shelf-info">
          <div id="shelf-kind" class="shelf-kind"></div>
          <h1 id="shelf-title" class="shelf-title"></h1>
          <div id="shelf-meta" class="shelf-meta"></div>
        </div>
      </header>
      <main id="rows" class="rows"></main>
    </div>
  </div>

  <section id="ambient" class="ambient" hidden>
    <div class="ambient-content">
      <div id="ambient-clock" class="ambient-clock"></div>
      <div id="ambient-date" class="ambient-date"></div>
      <div id="ambient-line" class="ambient-line"></div>
    </div>
  </section>

  <div class="topfade" aria-hidden="true"></div>
  <div class="bottomfade" aria-hidden="true"></div>
  <footer class="hints" id="hints"></footer>

  <div id="toast" class="toast" role="status"></div>

  <section id="settings" class="settings" hidden>
    <div class="settings-side">
      <div class="settings-glyph" id="settings-glyph"></div>
      <h2 id="settings-title">Ajustes</h2>
      <p id="settings-subtitle">TVDeck</p>
    </div>
    <div class="settings-panel">
      <div id="settings-list" class="settings-list"></div>
    </div>
  </section>

  <section id="overlay" class="overlay" hidden>
    <div id="overlay-card" class="overlay-card"></div>
  </section>

  <script>
    ['vendor/qrcode.js', 'js/platform.js', 'js/store.js', 'js/weather.js', 'js/icons.js',
      'js/categories.js', 'js/sounds.js', 'js/launcher.js'].forEach(function (src) {
      document.write('<script src="' + window.TVDECK_BASE + src + '"><\/script>');
    });
  </script>
</body>
</html>
